name: Generate GitHub Statistics

on:
  push:
    branches:
      - main
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Build
        run: zig build

      - name: Prepare generated branch
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          git config user.name "Sukumar-Elley/github-stats"
          git config user.email "github-stats[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin generated >/dev/null 2>&1; then
            git fetch origin generated
            git checkout -B generated origin/generated
          else
            git checkout -B generated
          fi

      - name: Generate SVG statistics
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
          EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
          EXCLUDE_PRIVATE: "false"
          SILENT: "true"
          MAX_RETRIES: "5"
        run: |
          ./zig-out/bin/github-stats

      - name: Commit generated files
        run: |
          git add overview.svg languages.svg
          git diff --cached --quiet || git commit -m "Update GitHub statistics"

      - name: Push generated branch
        run: |
          git push origin generated
